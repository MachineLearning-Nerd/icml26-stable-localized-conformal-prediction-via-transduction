[project]
name = "stcp-repro"
version = "0.1.0"
description = "Reproduction of 'Stable Localized Conformal Prediction via Transduction' (arXiv 2605.01452)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "torch>=2.5,<3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
package = false
